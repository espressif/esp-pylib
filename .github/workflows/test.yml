name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04  # latest with Python 3.7 support
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.7', '3.14']
    steps:
      - name: Checkout ref commit
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,serial,cli]

      - name: Run tests
        run: pytest -vs tests/
